<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <section class="login">
            <article class="login-imagem">
                <img src="img/ford-login.png" alt="">
                <h1 class="login-imagem-titulo">Na Ford, <span class="span-titulo">o futuro começa<br> agora.</span></h1>
            </article>
            <article class="login-container">
                <div class="login-titulo">
                <h1>Entrar No Painel</h1>
                <p>Use as suas credenciais de gestão para continuar.</p>
                </div>
                <form action="/login" method="POST" class="login-form">
                    <div class="login-form-campo">
                        <label>Usuario</label>
                        <input type="text" placeholder="Digite seu usuario" id="usuario">
                    </div>
                    <div class="login-form-campo">
                        <label>Senha</label>
                        <input type="password" placeholder="Digite sua senha" id="senha">
                    </div>
                    <button class="login-form-botao">Entrar</button>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
